name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle installé par l'action : aucun gradlew / gradle-wrapper.jar requis dans le dépôt
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Keystore fixe => même signature à chaque build => mises à jour possibles sur le projecteur
      - name: Restaurer le keystore de signature (secret optionnel)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > keystore/debug.keystore
            echo "Keystore fixe restauré."
          else
            echo "::warning::Secret DEBUG_KEYSTORE_BASE64 absent : APK signé avec une clé jetable (désinstallation requise avant chaque mise à jour)."
          fi

      # "shell: bash" explicite = bash -eo pipefail : l'étape échoue bien si Gradle échoue, le log est conservé
      - name: Compiler l'APK debug
        shell: bash
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Résumé de l'erreur (uniquement en cas d'échec)
        if: failure()
        run: |
          echo "=================== ERREURS DÉTECTÉES ==================="
          grep -E "^e: |error:|ERROR|FAILURE:|What went wrong" -A 8 build.log | head -n 150 || true

      - name: Joindre le log complet (uniquement en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      # Publication via gh (CLI préinstallée sur le runner) : suppression puis recréation
      # de la Release "latest" et de son tag sur le commit courant (remplace softprops, sujet à une course avec l API).
      - name: Publier la Release « latest »
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          git push origin :refs/tags/latest || true
          sleep 5
          gh release create latest app/build/outputs/apk/debug/app-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Keystone Switcher – build $GITHUB_RUN_NUMBER" \
            --notes "APK debug compilé depuis $GITHUB_SHA. Lien direct pour Downloader : https://github.com/$GITHUB_REPOSITORY/releases/download/latest/app-debug.apk" \
            --latest
          gh release view latest --json assets --jq '.assets[].name'

name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle installé par l'action : aucun gradlew / gradle-wrapper.jar requis dans le dépôt
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Keystore fixe => même signature à chaque build => mises à jour possibles sur le projecteur
      - name: Restaurer le keystore de signature (secret optionnel)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > keystore/debug.keystore
            echo "Keystore fixe restauré."
          else
            echo "::warning::Secret DEBUG_KEYSTORE_BASE64 absent : APK signé avec une clé jetable (désinstallation requise avant chaque mise à jour)."
          fi

      - name: Compiler l'APK debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Déplacer le tag latest sur ce commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes || true
          git tag -f latest
          git push -f origin refs/tags/latest

      - name: Publier la Release « latest »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Keystone Switcher – build ${{ github.run_number }}
          body: |
            APK debug compilé depuis ${{ github.sha }}.
            Lien direct pour Downloader :
            https://github.com/${{ github.repository }}/releases/download/latest/app-debug.apk
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true

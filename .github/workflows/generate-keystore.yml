name: Générer le keystore de signature (une seule fois)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Générer debug.keystore et son encodage base64
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Keystone Switcher Debug,O=Personal,C=FR"
          base64 -w 0 debug.keystore > DEBUG_KEYSTORE_BASE64.txt

      # Télécharge l'artefact, copie le contenu du .txt dans le secret DEBUG_KEYSTORE_BASE64, puis supprime l'artefact.
      - name: Exporter en artefact (expire après 1 jour)
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore-base64
          path: DEBUG_KEYSTORE_BASE64.txt
          retention-days: 1
